name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    # DueKhata is a Windows application, so the tests run on Windows even
    # though expense_tracker.py itself is portable.
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the minimum the README claims; testing it keeps that honest.
        python-version: ["3.10", "3.12"]

    name: tests (Python ${{ matrix.python-version }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
